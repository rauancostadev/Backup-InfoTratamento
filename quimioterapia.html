const CATS = [
  { key:'Quimioterápicos Orais', short:'Orais',          cls:'cat-oral',   ico:'💊' },
  { key:'Quimioterápicos Injetáveis',      short:'Injetáveis', cls:'cat-sus-inj',ico:'💉' },
  { key:'Quimioterápicos da Hematologia',           short:'Hematologia',    cls:'cat-hemato', ico:'🩸' }
];

/* filtros rápidos criados a partir do texto da observação (a ordem define a cor do selo) */
const FLAGS = [
  { k:'judic',  label:'Judicializado',   cls:'judic',    test:/judicializ/ },
  { k:'unicat', label:'UNICAT',          cls:'unicat',   test:/unicat/ },
  { k:'leito',  label:'Leito',           cls:'leito',    test:/leito/ },
  { k:'sc',     label:'Via SC',          cls:'sc',       test:/\bsc\b|subcutan/ },
  { k:'dia',    label:'Dia restrito',    cls:'dia',      test:/tercas ou quartas|quintas ou sextas|apenas sextas/ },
  { k:'p34',    label:'Poltronas 05–34', cls:'poltrona', test:/poltronas 05 a 34/ },
  { k:'p19',    label:'Poltronas 05–19', cls:'poltrona', test:/poltronas 05 a 19/ },
  { k:'evol',   label:'Checar evolução', cls:'',         test:/(checar|conforme) evolu/ }
];

const $ = id => document.getElementById(id);

/* lista única com a categoria e os filtros de cada protocolo */
const ITEMS = [];
CATS.forEach(c => (quimioData[c.key] || []).forEach(it => {
  const o = UI.norm(it.obs || '');
  const fl = FLAGS.filter(f => f.test.test(o));
  ITEMS.push({ ...it, cat:c, flags:fl.map(f => f.k), fcls: fl.length ? fl[0].cls : '' });
}));

const state = { cat:'all', flag:'all', q:'' };

function matches(it){
  const q = UI.norm(state.q.trim());
  return (state.cat==='all' || it.cat.key===state.cat) &&
         (state.flag==='all' || it.flags.includes(state.flag)) &&
         (!q || UI.norm(it.nome + ' ' + it.intervalo + ' ' + (it.obs||'')).includes(q));
}

function renderChips(){
  $('catChips').innerHTML =
    `<button class="chip ${state.cat==='all'?'active':''}" data-c="all">Todos <em>${ITEMS.length}</em></button>` +
    CATS.map(c => `<button class="chip ${state.cat===c.key?'active':''}" data-c="${UI.esc(c.key)}">${c.ico} ${c.short} <em>${ITEMS.filter(i=>i.cat===c).length}</em></button>`).join('');
  $('flagChips').innerHTML =
    `<button class="chip ${state.flag==='all'?'active':''}" data-fl="all">Todas</button>` +
    FLAGS.map(f => `<button class="chip ${state.flag===f.k?'active':''}" data-fl="${f.k}">${f.label} <em>${ITEMS.filter(i=>i.flags.includes(f.k)).length}</em></button>`).join('');
}

function card(it){
  return `<article class="proto ${it.cat.cls}">
    <h3>${UI.esc(it.nome)}</h3>
    <div class="ret">⏱️ <span><b>Retorno:</b> ${UI.esc(it.intervalo)}</span></div>
    ${it.obs ? `<span class="flag ${it.fcls}">⚠️ ${UI.esc(it.obs)}</span>` : ''}
  </article>`;
}

function render(){
  const list = ITEMS.filter(matches);
  $('kTotal').textContent = list.length;
  $('kOral').textContent = list.filter(i=>i.cat===CATS[0]).length;
  $('kSus').textContent  = list.filter(i=>i.cat===CATS[1]).length;
  $('kHem').textContent  = list.filter(i=>i.cat===CATS[2]).length;

  const html = CATS.map(c => {
    const items = list.filter(i => i.cat===c);
    if(!items.length) return '';
    return `<section class="section ${c.cls}">
      <div class="sec-head"><h2>${c.ico} ${UI.esc(c.key)}</h2><span class="count-pill">${items.length}</span></div>
      <div class="proto-grid">${items.map(card).join('')}</div>
    </section>`;
  }).join('');
  $('lista').innerHTML = html || '<div class="nothing"><big>🔎</big>Nenhum protocolo encontrado</div>';
}

$('busca').addEventListener('input', UI.debounce(e => { state.q = e.target.value; render(); }, 100));
$('catChips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  state.cat = b.dataset.c; renderChips(); render();
});
$('flagChips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  state.flag = b.dataset.fl; renderChips(); render();
});

renderChips();
render();
</script>
