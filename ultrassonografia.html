};
const RULES = [
  ['Biópsia e Punção',        /biops|puncao|agulhamento|clip metalico/],
  ['Partes moles e outros',   /estrut\. superfic|partes moles|partes superficiais|^us pele|paniculo|virilha|inguinal/],
  ['Obstétrico',              /obstetric|morfologic|translucencia|transluc\./],
  ['Mama',                    /mama|axila/],
  ['Vascular',                /^us doppler|arteria|venos|veia|carotid|aorta|jugular/],
  ['Pélvico e Urológico',     /pelvic|transvaginal|endovaginal|prostat|transretal|escrot|penis|vesiculas seminais|urinari|ovulacao|reserva ovariana|foliculos/],
  ['Abdome',                  /abdom|figado|biliar|retroperit|flanco|hipocondrio|fossa iliaca|elastografia hepatica/],
  ['Cabeça e Pescoço',        /tireoide|paratireoide|cervical|pescoco|glandula|parotid|submandib|salivar|^us face|couro cabeludo|fontanela|cranio|nucal/],
  ['Músculo-esquelético',     /ombro|cotovelo|punho|\bmao\b|braco|joelho|tornozelo|calcanhar|\bpe (direito|esquerdo)\b|quadril|coxo|coxa|perna|panturrilha|trocanter|articula|escapula|omoplata|costela|esterno|trapezio|musculo|fossa cubital|peitoral|plastrao|toracica/]
];
function categorize(proc){
  const n = UI.norm(proc);
  for(const [cat, re] of RULES) if(re.test(n)) return cat;
  return 'Partes moles e outros';
}

/* ---------- estruturas de consulta ---------- */
const $ = id => document.getElementById(id);
const plural = (n,s,p) => n + ' ' + (n===1 ? s : p);
const disp = UI.titleCase;                        // "JOAO PAULO" -> "Joao Paulo"
const cvars = cat => `--c:${CAT_META[cat].c};--bg-c:${CAT_META[cat].c}1f`;
const byName = (a,b) => a.localeCompare(b,'pt-BR');

const merged = {};
RAW.forEach(r => {
  const o = merged[r.procedure] || (merged[r.procedure] = { procedure:r.procedure, set:new Set() });
  r.professional.split(',').map(s => s.trim()).filter(Boolean).forEach(p => o.set.add(p));
});
const PROCS = Object.values(merged)
  .map(o => ({ procedure:o.procedure, profs:[...o.set].sort(byName), cat:categorize(o.procedure) }))
  .sort((a,b) => byName(a.procedure,b.procedure));
PROCS.forEach((p,i) => { p.i = i; p.nq = UI.norm(p.procedure + ' ' + p.profs.join(' ')); });

const PROFS = {};                                  // profissional -> procedimentos
PROCS.forEach(p => p.profs.forEach(n => (PROFS[n] = PROFS[n] || []).push(p)));
const PROF_NAMES = Object.keys(PROFS).sort(byName);
const CAT_NAMES = Object.keys(CAT_META).filter(c => PROCS.some(p => p.cat===c));

const state = { q:'', cat:'all', prof:'', view:'proc' };

function matches(p){
  const q = UI.norm(state.q.trim());
  return (state.cat==='all' || p.cat===state.cat) &&
         (!state.prof || p.profs.includes(state.prof)) &&
         (!q || p.nq.includes(q));
}

/* ---------- filtros ---------- */

  $('chips').innerHTML =
    `<button class="chip ${state.cat==='all'?'active':''}" data-c="all">Todos <em>${PROCS.length}</em></button>` +
    CAT_NAMES.map(c => `<button class="chip ${state.cat===c?'active':''}" style="--c:${CAT_META[c].c}" data-c="${UI.esc(c)}"><i></i>${CAT_META[c].ico} ${UI.esc(c)} <em>${PROCS.filter(p=>p.cat===c).length}</em></button>`).join('');
}
function renderSelect(){
  $('profSel').innerHTML = '<option value="">Todos os profissionais</option>' +
    PROF_NAMES.map(n => `<option value="${UI.esc(n)}">${UI.esc(disp(n))} (${PROFS[n].length})</option>`).join('');
  $('profSel').value = state.prof;
}

/* ---------- procedimentos ---------- */
function procCard(p){
  return `<button class="us-card" style="${cvars(p.cat)}" data-i="${p.i}" type="button">
    <div><span class="cat-tag">${CAT_META[p.cat].ico} ${UI.esc(p.cat)}</span><h3>${UI.esc(p.procedure)}</h3></div>
    <span class="med-count">👥 ${plural(p.profs.length,'profissional habilitado','profissionais habilitados')}</span>
  </button>`;
}

/* ---------- profissionais ---------- */
function profCard(name, list){
  const counts = {};
  list.forEach(p => counts[p.cat] = (counts[p.cat]||0) + 1);
  const pills = Object.keys(counts).sort((a,b) => counts[b]-counts[a]).map(c =>
    `<span class="tag-pill" style="${cvars(c)}">${CAT_META[c].ico} ${UI.esc(c)} · ${counts[c]}</span>`).join('');
  return `<button class="mcard prof-card" data-p="${UI.esc(name)}" type="button">
    <div class="mhead"><div class="avatar">${UI.esc(UI.initial(name))}</div><div><h3>${UI.esc(disp(name))}</h3><small>${plural(list.length,'procedimento','procedimentos')}</small></div></div>
    <div class="pills">${pills}</div>
  </button>`;
}

/* ---------- render ---------- */
function render(){
  const list = PROCS.filter(matches);

  /* indicadores */
  const profsIn = new Set(); list.forEach(p => p.profs.forEach(n => profsIn.add(n)));
  const q = UI.norm(state.q.trim());
  if(state.prof) { profsIn.clear(); profsIn.add(state.prof); }
  $('kProc').textContent = list.length;
  $('kProf').textContent = profsIn.size;
  $('kCat').textContent = new Set(list.map(p => p.cat)).size;

  /* visão de procedimentos */
  $('viewProc').innerHTML = list.length ? list.map(procCard).join('') :
    '<div class="nothing"><big>🔎</big>Nenhum procedimento encontrado</div>';

  /* visão de profissionais (respeita categoria e busca) */
  const names = PROF_NAMES.filter(n => {
    if(state.prof && n!==state.prof) return false;
    const mine = PROFS[n].filter(p => state.cat==='all' || p.cat===state.cat);
    if(!mine.length) return false;
    return !q || UI.norm(n).includes(q) || mine.some(p => UI.norm(p.procedure).includes(q));
  });
  $('viewProf').innerHTML = names.length ? names.map(n => profCard(n, PROFS[n].filter(p => state.cat==='all' || p.cat===state.cat))).join('') :
    '<div class="nothing"><big>🔎</big>Nenhum profissional encontrado</div>';

  $('count').textContent = state.view==='proc'
    ? plural(list.length,'procedimento exibido','procedimentos exibidos')
    : plural(names.length,'profissional exibido','profissionais exibidos');
  $('clear').classList.toggle('hidden', !(state.q || state.cat!=='all' || state.prof));

  $('viewProc').style.display = state.view==='proc' ? '' : 'none';
  $('viewProf').style.display = state.view==='prof' ? '' : 'none';
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('active', b.dataset.v===state.view));
  renderChips();
}

/* ---------- janelas ---------- */
let ctx = null;
function openProc(i){
  const p = PROCS[i];
  ctx = { type:'proc', p };
  const m = UI.openModal({
    title: p.procedure,
    sub: `${p.cat} • ${plural(p.profs.length,'profissional habilitado','profissionais habilitados')}`,
    html: `<div class="prof-list">${p.profs.map(n =>
      `<button class="prof-item" data-p="${UI.esc(n)}" type="button"><span class="mini-av">${UI.esc(UI.initial(n))}</span>${UI.esc(disp(n))}<small>${PROFS[n].length} exames</small></button>`).join('')}</div>`,
    foot: '<button class="btn ghost" id="mCopy" type="button">📋 Copiar lista</button>'
  });
  m.foot.querySelector('#mCopy').onclick = () =>
    UI.copy(p.procedure + '\n' + p.profs.map(n => '- ' + disp(n)).join('\n'), 'Lista copiada!');
}

function openProf(name){
  const list = PROFS[name];
  ctx = { type:'prof', name };
  const groups = CAT_NAMES.map(c => ({ c, items:list.filter(p => p.cat===c) })).filter(g => g.items.length);
  const m = UI.openModal({
    size:'wide',
    title: disp(name),
    sub: plural(list.length,'procedimento habilitado','procedimentos habilitados'),
    html: groups.map(g => `
      <div style="margin-bottom:18px;${cvars(g.c)}">
        <div class="sec-head" style="margin:0 0 6px"><span class="cat-tag" style="margin:0">${CAT_META[g.c].ico} ${UI.esc(g.c)}</span><span class="count-pill">${g.items.length}</span></div>
        <div class="prof-list">${g.items.map(p => `<button class="prof-item" data-i="${p.i}" type="button">${UI.esc(p.procedure)}</button>`).join('')}</div>
      </div>`).join(''),
    foot: '<button class="btn ghost" id="mCopy" type="button">📋 Copiar lista</button><button class="btn" id="mFilter" type="button">Filtrar a página por este profissional</button>'
  });
  m.foot.querySelector('#mCopy').onclick = () =>
    UI.copy(disp(name) + '\n' + list.map(p => '- ' + p.procedure).join('\n'), 'Lista copiada!');
  m.foot.querySelector('#mFilter').onclick = () => {
    state.prof = name; state.view = 'proc'; $('profSel').value = name;
    UI.closeModal(); render(); window.scrollTo({ top:0, behavior:'smooth' });
  };
}

/* ---------- eventos ---------- */
$('busca').addEventListener('input', UI.debounce(e => { state.q = e.target.value; render(); }, 100));
$('profSel').addEventListener('change', e => { state.prof = e.target.value; render(); });
$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if(!b) return; state.cat = b.dataset.c; render(); });
$('seg').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; state.view = b.dataset.v; render(); });
$('clear').addEventListener('click', () => {
  state.q = ''; state.cat = 'all'; state.prof = '';
  $('busca').value = ''; $('profSel').value = ''; render();
});
document.addEventListener('click', e => {
  const pr = e.target.closest('[data-p]'); if(pr){ openProf(pr.dataset.p); return; }
  const pc = e.target.closest('[data-i]'); if(pc){ openProc(+pc.dataset.i); }
});

/* indicador fixo: quem faz mais procedimentos */
(function(){
  const top = PROF_NAMES.reduce((a,n) => PROFS[n].length > PROFS[a].length ? n : a, PROF_NAMES[0]);
  $('kTop').textContent = disp(top);
  $('kTop').title = disp(top);
  $('kTopSub').textContent = 'Mais procedimentos · ' + PROFS[top].length;
})();

renderSelect();
render();
</script>
</body>
</html>
