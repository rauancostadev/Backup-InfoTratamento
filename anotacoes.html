.au-tabs button.active{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(15,23,42,.1)}
.au-f{display:block;margin-bottom:14px}
.au-f > span{display:block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.au-in{position:relative}
.au-in input,.au-f textarea,.au-f input.au-plain{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-size:.95rem;outline:none;transition:.2s}
.au-in input{padding-right:46px}
.au-in input:focus,.au-f textarea:focus,.au-f input.au-plain:focus{border-color:var(--azul);box-shadow:0 0 0 4px rgba(26,79,136,.12)}
.au-f textarea{min-height:130px;resize:vertical}
.au-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:1rem;padding:6px 8px;opacity:.6}
.au-eye:hover{opacity:1}
.au-rules{list-style:none;margin:-4px 0 14px;padding:0;font-size:.8rem;color:var(--muted);display:grid;gap:3px}
.au-rules li::before{content:"○ ";color:#cbd5e1}
.au-rules li.ok{color:var(--verde);font-weight:600}
.au-rules li.ok::before{content:"✔ ";color:var(--verde)}
.au-msg{display:none;margin:0 0 14px;padding:10px 12px;border-radius:10px;font-size:.85rem;font-weight:600}
.au-msg.show{display:block}
.au-msg.err{background:#fdecea;color:var(--vermelho)}
.au-msg.ok{background:var(--ok-bg);color:var(--verde)}
.au-msg.warn{background:#fff8e1;color:#8a5a00}
.au-go{width:100%;padding:12px;font-size:.95rem;border-radius:12px}
.au-go[disabled]{opacity:.6;pointer-events:none}
.au-link{display:block;margin:14px auto 0;background:none;border:0;color:var(--azul);font-weight:700;font-size:.83rem;text-decoration:underline}
.au-note{margin-top:14px;font-size:.76rem;color:var(--muted);text-align:center}
.au-panel-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.au-panel-tabs button{border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 14px;border-radius:999px;font-weight:700;font-size:.83rem}
.au-panel-tabs button.active{background:var(--navy);border-color:var(--navy);color:#fff}
.au-list{display:grid;gap:8px;margin-bottom:18px}
.au-item{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.au-item b{display:block;font-size:.9rem;color:var(--navy);overflow-wrap:anywhere}
.au-item small{color:var(--muted);display:block;max-width:360px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.au-item .au-acts{display:flex;gap:6px;flex-shrink:0}
.au-empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed #cbd5e1;border-radius:12px;font-weight:600;font-size:.88rem}
.au-sep{border:0;border-top:1px solid var(--line);margin:4px 0 16px}
.btn.danger{background:var(--vermelho)}
.btn.danger:hover{background:#8e1c1c}
.nova-nota{margin-left:auto}
.painel-btn{margin-left:0}

.au-main{flex:1;min-width:140px}
.au-item .au-acts{flex-wrap:wrap}

.au-bar{display:grid;grid-template-columns:minmax(120px,220px) 1fr 36px;gap:10px;align-items:center;margin-bottom:8px;font-size:.85rem}
.au-bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  };

const META = {
  'Saudações':              { ico:'👋', c:'#1a4f88' },
  'Informações':            { ico:'ℹ️', c:'#00838f' },
  'Contatos':               { ico:'📞', c:'#CC5500' },
  'Valores de Consultas':   { ico:'💰', c:'#2e7d32' },
  'Informações 1ª Vez':     { ico:'🆕', c:'#6a1b9a' },
  'Preparos das Consultas': { ico:'🎒', c:'#c2185b' },

};
const meta = g => META[g] || { ico:'💬', c:'#1a4f88' };
const cvars = g => `--c:${meta(g).c};--bg-c:${meta(g).c}1f`;

const $ = id => document.getElementById(id);
const ITEMS = GROUPS.flatMap(g => g.items.map(i => ({ id:i.id, label:i.label, g:g.title, text:TEXTOS[i.id] || '' })));
ITEMS.forEach(i => i.nq = UI.norm(i.label + ' ' + i.text));
const byId = Object.fromEntries(ITEMS.map(i => [i.id, i]));

const state = { q:'', g:'all' };
const waHTML = t => UI.esc(t).replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>');
const clean = t => t.replace(/\*/g, '').replace(/[ \t]+/g, ' ').trim();

/* saudação sugerida pelo horário */
const hour = new Date().getHours();
const NOW_ID = hour < 12 ? 'bomdia' : hour < 18 ? 'boatarde' : 'boanoite';

/* usadas recentemente (guardadas só neste navegador) */
let recent = (UI.store.get('rr_recent', []) || []).filter(id => byId[id]).slice(0, 6);

function use(id){
  recent = [id].concat(recent.filter(x => x !== id)).slice(0, 6);
  UI.store.set('rr_recent', recent);
  renderRecent();
}
function copyItem(id){
  const it = byId[id]; if(!it) return;
  UI.copy(it.text, 'Copiado: ' + it.label);
  use(id);
}

function renderRecent(){
  $('kRecent').textContent = recent.length;
  const box = $('recent');
  box.classList.toggle('hidden', !recent.length);
  box.innerHTML = '<span class="chips-label">Recentes</span>' + recent.map(id =>
    `<button class="chip" data-copy="${UI.esc(id)}" type="button" title="Copiar novamente">${UI.esc(byId[id].label)}</button>`).join('') +
    '<button class="btn ghost" id="clearRecent" type="button" style="margin-left:auto">Limpar</button>';
}

function renderChips(){
  $('chips').innerHTML =
    `<button class="chip ${state.g==='all'?'active':''}" data-g="all">Todas <em>${ITEMS.length}</em></button>` +
    GROUPS.map(g => `<button class="chip ${state.g===g.title?'active':''}" style="--c:${meta(g.title).c}" data-g="${UI.esc(g.title)}"><i></i>${meta(g.title).ico} ${UI.esc(g.title)} <em>${g.items.length}</em></button>`).join('');
}

function card(it){
  const now = it.id === NOW_ID ? '<span class="count-pill" style="--c:#2e7d32;--bg-c:#e8f5e9">Sugerida agora</span>' : '';
  return `<article class="tpl" style="${cvars(it.g)}" data-copy="${UI.esc(it.id)}" tabindex="0" role="button" aria-label="Copiar ${UI.esc(it.label)}">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><h3>${UI.esc(it.label)}</h3>${now}</div>
    <p class="prev">${UI.esc(clean(it.text))}</p>
    <div class="acts">
      <button class="btn" data-copy="${UI.esc(it.id)}" type="button">📋 Copiar</button>
      <button class="btn ghost" data-view="${UI.esc(it.id)}" type="button">👁 Ver</button>
    </div>
  </article>`;
}

function render(){
  const q = UI.norm(state.q.trim());
  const list = ITEMS.filter(i => (state.g==='all' || i.g===state.g) && (!q || i.nq.includes(q)));
  $('kTotal').textContent = list.length;
  $('kGroups').textContent = new Set(list.map(i => i.g)).size;
  $('lista').innerHTML = GROUPS.map(g => {
    const items = list.filter(i => i.g===g.title);
    if(!items.length) return '';
    return `<section class="section" style="${cvars(g.title)}">
      <div class="sec-head"><h2>${meta(g.title).ico} ${UI.esc(g.title)}</h2><span class="count-pill">${items.length}</span></div>
      <div class="tpl-grid">${items.map(card).join('')}</div>
    </section>`;
  }).join('') || '<div class="nothing"><big>🔎</big>Nenhuma resposta encontrada</div>';
  renderChips();
}

function viewItem(id){
  const it = byId[id]; if(!it) return;
  const m = UI.openModal({
    title: it.label, sub: it.g,
    html: `<div class="wa-bg"><div class="wa">${waHTML(it.text)}</div></div>`,
    foot: '<button class="btn" id="mCopy" type="button">📋 Copiar</button>'
  });
  m.foot.querySelector('#mCopy').onclick = () => { copyItem(id); UI.closeModal(); };
}

/* ---------- eventos ---------- */
$('busca').addEventListener('input', UI.debounce(e => { state.q = e.target.value; render(); }, 100));
$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if(!b) return; state.g = b.dataset.g; render(); });

document.addEventListener('click', e => {
  if(e.target.closest('#clearRecent')){ recent = []; UI.store.set('rr_recent', []); renderRecent(); return; }
  const v = e.target.closest('[data-view]'); if(v){ e.stopPropagation(); viewItem(v.dataset.view); return; }
  const c = e.target.closest('[data-copy]'); if(c){ copyItem(c.dataset.copy); }
});
$('lista').addEventListener('keydown', e => {
  if((e.key==='Enter' || e.key===' ') && e.target.classList.contains('tpl')){
    e.preventDefault(); copyItem(e.target.dataset.copy);
  }
});

const nowItem = byId[NOW_ID];
$('kNow').textContent = nowItem ? nowItem.label : '—';
renderRecent();
render();
</script>

<script>
/* =====================================================================
   LOGIN, PAINEL DE CONTROLE, PERFIS (OPERADOR / GESTOR) E RESPOSTAS COMPARTILHADAS
   ---------------------------------------------------------------------
   Banco de dados: Firebase (Authentication + Firestore). As chaves do projeto
   ficam em FIREBASE_CONFIG. Com FIREBASE_CONFIG vazio, a página roda em MODO DE
   TESTE LOCAL (tudo só neste navegador).

   Perfis:  administrador = criador do sistema; tem tudo que o gestor tem e é o único

            gestor        = edita as respostas compartilhadas e gerencia usuários;
            operador      = usa as respostas e tem as próprias anotações.
   A PRIMEIRA conta criada no sistema vira ADMINISTRADOR automaticamente.
   ===================================================================== */
(function () {
'use strict';

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyApmPmqMNcEw7rPCIfh_CBCjfGLZBdG11Q",
  authDomain: "infotratamento.firebaseapp.com",
  projectId: "infotratamento",
  appId: "1:972789860884:web:a89ec872539d2613173501"
};

const GRUPO = 'Minhas Anotações';
const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
const q = (s, r) => (r || document).querySelector(s);
const qa = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = UI.esc;
const FAV = '__fav';

/* cópia das respostas originais do arquivo (a base que a gestão pode ajustar) */
const BASE_GROUPS = JSON.parse(JSON.stringify(GROUPS));
const BASE_TEXTOS = Object.assign({}, TEXTOS);
const BASE_IDS = new Set(BASE_GROUPS.flatMap(g => g.items.map(i => i.id)));

/* ---------- regra da senha: mínimo 8, letras, números e caractere especial ---------- */
const RULES = [
  { t: 'Mínimo de 8 caracteres',  ok: p => p.length >= 8 },
  { t: 'Contém letras',           ok: p => /\p{L}/u.test(p) },
  { t: 'Contém números',          ok: p => /\d/.test(p) },
  { t: 'Contém caractere especial (ex.: ! @ # $ % &)', ok: p => /[^\p{L}\d\s]/u.test(p) }
];
const pwValid = p => RULES.every(r => r.ok(p));
const rulesHTML = () => '<ul class="au-rules">' + RULES.map(r => '<li>' + esc(r.t) + '</li>').join('') + '</ul>';
function bindRules(input, list){
  const upd = () => [...list.children].forEach((li, i) => li.classList.toggle('ok', RULES[i].ok(input.value)));
  input.addEventListener('input', upd); upd();
}

const ERROS = {
  'auth/invalid-credential': 'E-mail ou senha incorretos.',
  'auth/wrong-password': 'E-mail ou senha incorretos.',
  'auth/user-not-found': 'E-mail ou senha incorretos.',
  'auth/invalid-email': 'E-mail inválido.',
  'auth/email-already-in-use': 'Já existe uma conta com este e-mail.',
  'auth/weak-password': 'Senha fraca. Siga os requisitos da senha.',
  'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos e tente novamente.',
  'auth/network-request-failed': 'Sem conexão com o servidor. Verifique sua internet.',
  'auth/requires-recent-login': 'Por segurança, saia e entre novamente e repita a operação.',
  'permission-denied': 'Sem permissão no banco de dados. Confira se as regras do Firestore (arquivo firestore.rules) foram publicadas.',
  'app/nao-autorizado': 'Este e-mail não está autorizado a criar conta. Peça ao gestor ou administrador para liberar o seu e-mail.',
  'app/desativada': 'Conta desativada. Fale com o gestor ou administrador.',
  'local/exists': 'Já existe uma conta com este e-mail.',
  'local/nocrypto': 'O modo de teste exige HTTPS ou localhost.',
  'local/noreset': 'Redefinição por e-mail só funciona com o banco Firebase configurado.'
};
const erroMsg = e => ERROS[e && e.code] || ('Não foi possível concluir. ' + ((e && e.message) || ''));

/* =============== BACKEND 1: Firebase =============== */
async function backendFirebase(){
  const [app, A, F] = await Promise.all([
    import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'), import(SDK + 'firebase-firestore.js')
  ]);
  const fb = app.initializeApp(FIREBASE_CONFIG), auth = A.getAuth(fb), db = F.getFirestore(fb);
  auth.languageCode = 'pt-BR';
  const usr = () => auth.currentUser;
  const D = (...p) => F.doc(db, ...p);
  const C = (...p) => F.collection(db, ...p);
  const pref = () => D('usuarios', usr().uid);
  const notas = () => C('usuarios', usr().uid, 'notas');
  const rows = s => s.docs.map(d => Object.assign({ id: d.id }, d.data()));
  return {
    mode: 'firebase',
    watch: cb => A.onAuthStateChanged(auth, u => cb(u ? { id: u.uid, email: u.email } : null)),
    signIn: (e, p) => A.signInWithEmailAndPassword(auth, e, p),
    signUp: (e, p) => A.createUserWithEmailAndPassword(auth, e, p),
    signOut: () => A.signOut(auth),
    reset: e => A.sendPasswordResetEmail(auth, e),
    async changePw(cur, nw){
      await A.reauthenticateWithCredential(usr(), A.EmailAuthProvider.credential(usr().email, cur));
      await A.updatePassword(usr(), nw);
    },
    /* perfil */
    async getProfile(){ const s = await F.getDoc(pref()); return s.exists() ? Object.assign({ uid: usr().uid }, s.data()) : null; },
    async createProfile(){
      const email = usr().email.toLowerCase();
      const base = { email, nome: '', tema: 'light', favoritos: [], usos: {}, ordem: [], ativo: true, criado: Date.now() };
      const g = await F.getDoc(D('config', 'geral'));
      if (!g.exists()){                         /* primeira conta do sistema = administrador (criador) */
        const b = F.writeBatch(db), p = Object.assign({}, base, { papel: 'admin' });
        b.set(pref(), p); b.set(D('config', 'geral'), { cadastroAberto: false, criado: Date.now(), criadorUid: usr().uid });
        await b.commit(); return Object.assign({ uid: usr().uid }, p);
      }
      const p = Object.assign({}, base, { papel: 'operador' });
      try { await F.setDoc(pref(), p); }
      catch (e) { if (e.code === 'permission-denied') throw { code: 'app/nao-autorizado' }; throw e; }
      return Object.assign({ uid: usr().uid }, p);
    },
    updateProfile: patch => F.updateDoc(pref(), patch),
    async discardIfNew(){
      const u = usr(); if (u && u.metadata.creationTime === u.metadata.lastSignInTime) { try { await A.deleteUser(u); } catch (e) {} }
    },
    verified: () => !!usr().emailVerified,
    sendVerification: () => A.sendEmailVerification(usr()),
    async reloadUser(){ await usr().reload(); return usr().emailVerified; },
    async deleteAccount(pw){
      await A.reauthenticateWithCredential(usr(), A.EmailAuthProvider.credential(usr().email, pw));
      const s = await F.getDocs(notas());
      for (const d of s.docs) await F.deleteDoc(d.ref);
      await F.deleteDoc(pref());
      await A.deleteUser(usr());
    },
    /* gestão (gestor / administrador): o gestor nunca recebe os administradores */
    async listUsers(papel){
      const ref = papel === 'admin' ? C('usuarios') : F.query(C('usuarios'), F.where('papel', 'in', ['operador', 'gestor']));
      return (await F.getDocs(ref)).docs.map(d => Object.assign({ uid: d.id }, d.data()));
    },
    setUserAdmin: (uid, patch) => F.updateDoc(D('usuarios', uid), patch),
    async getConfig(){ const s = await F.getDoc(D('config', 'geral')); return s.exists() ? s.data() : { cadastroAberto: false }; },
    setConfig: patch => F.updateDoc(D('config', 'geral'), patch),
    async listAutorizados(){ return (await F.getDocs(C('autorizados'))).docs.map(d => d.id); },
    addAutorizado: e => F.setDoc(D('autorizados', e.toLowerCase()), { por: usr().email, criado: Date.now() }),
    delAutorizado: e => F.deleteDoc(D('autorizados', e.toLowerCase())),
    /* respostas compartilhadas */
    async listShared(){ return rows(await F.getDocs(C('respostas'))); },
    async saveShared(id, d){
      const data = { grupo: d.grupo, titulo: d.titulo, texto: d.texto, oculta: !!d.oculta, atualizado: Date.now(), por: usr().email };
      if (id) await F.setDoc(D('respostas', id), data); else await F.addDoc(C('respostas'), data);
    },
    deleteShared: id => F.deleteDoc(D('respostas', id)),
    /* anotações pessoais */
    async list(){ return rows(await F.getDocs(notas())); },
    async save(n){
      const data = { titulo: n.titulo, texto: n.texto, categoria: n.categoria || '', atualizado: Date.now() };
      if (n.id) await F.setDoc(F.doc(notas(), n.id), data); else await F.addDoc(notas(), data);
    },
    del: id => F.deleteDoc(F.doc(notas(), id))
  };
}

/* =============== BACKEND 2: teste local (localStorage) =============== */
function backendLocal(){
  const S = UI.store, listeners = [];
  const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  async function hash(pw, salt){
    if (!(window.crypto && crypto.subtle)) throw { code: 'local/nocrypto' };
    const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: new TextEncoder().encode(salt), iterations: 120000, hash: 'SHA-256' }, k, 256));
  }
  const users = () => S.get('an_users', {});
  const DB = () => Object.assign({ usuarios: {}, respostas: {}, autorizados: {}, config: null, notas: {} }, S.get('an_db', {}));
  const save = d => S.set('an_db', d);
  const cur = () => { try { return sessionStorage.getItem('an_sess'); } catch (e) { return null; } };
  const setCur = e => { try { e ? sessionStorage.setItem('an_sess', e) : sessionStorage.removeItem('an_sess'); } catch (x) {} };
  const emit = () => listeners.forEach(cb => cb(cur() ? { id: cur(), email: cur() } : null));
  const rid = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const mine = () => DB().usuarios[cur()];
  const gestao = () => { const p = mine(); return p && p.ativo && (p.papel === 'gestor' || p.papel === 'admin'); };
  const souAdmin = () => { const p = mine(); return p && p.ativo && p.papel === 'admin'; };
  const need = () => { if (!gestao()) throw { code: 'permission-denied' }; };
  return {
    mode: 'local',
    watch(cb){ listeners.push(cb); cb(cur() ? { id: cur(), email: cur() } : null); },
    async signUp(e, p){
      e = e.toLowerCase(); const u = users();
      if (u[e]) throw { code: 'local/exists' };
      const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
      u[e] = { salt, h: await hash(p, salt) }; S.set('an_users', u); setCur(e); emit();
    },
    async signIn(e, p){
      e = e.toLowerCase(); const r = users()[e];
      if (!r || (await hash(p, r.salt)) !== r.h) throw { code: 'auth/invalid-credential' };
      setCur(e); emit();
    },
    async signOut(){ setCur(null); emit(); },
    async reset(){ throw { code: 'local/noreset' }; },
    async changePw(c, n){
      const u = users(), r = u[cur()];
      if ((await hash(c, r.salt)) !== r.h) throw { code: 'auth/invalid-credential' };
      const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
      u[cur()] = { salt, h: await hash(n, salt) }; S.set('an_users', u);
    },
    async getProfile(){ const p = mine(); return p ? Object.assign({ uid: cur() }, p) : null; },
    async createProfile(){
      const d = DB(), email = cur();
      const base = { email, nome: '', tema: 'light', favoritos: [], usos: {}, ordem: [], ativo: true, criado: Date.now() };
      if (!d.config){ d.config = { cadastroAberto: false, criadorUid: email }; d.usuarios[email] = Object.assign(base, { papel: 'admin' }); }
      else if (d.config.cadastroAberto || d.autorizados[email]) d.usuarios[email] = Object.assign(base, { papel: 'operador' });
      else throw { code: 'app/nao-autorizado' };
      save(d); return Object.assign({ uid: email }, d.usuarios[email]);
    },
    async updateProfile(patch){ const d = DB(); Object.assign(d.usuarios[cur()], patch); save(d); },
    async discardIfNew(){ const u = users(); delete u[cur()]; S.set('an_users', u); },
    verified: () => true,
    async sendVerification(){}, async reloadUser(){ return true; },
    async deleteAccount(pw){
      const u = users(), r = u[cur()];
      if ((await hash(pw, r.salt)) !== r.h) throw { code: 'auth/invalid-credential' };
      const d = DB(), e = cur(); delete d.usuarios[e]; delete d.notas[e]; save(d);
      delete u[e]; S.set('an_users', u); setCur(null); emit();
    },
    async listUsers(){ need(); const d = DB(); return Object.keys(d.usuarios).map(k => Object.assign({ uid: k }, d.usuarios[k])).filter(u => souAdmin() || u.papel !== 'admin'); },
    async setUserAdmin(uid, patch){
      need(); const d = DB(), alvo = d.usuarios[uid];
      if (!alvo || uid === cur() || uid === (d.config || {}).criadorUid) throw { code: 'permission-denied' };
      if (!souAdmin() && (alvo.papel === 'admin' || patch.papel === 'admin')) throw { code: 'permission-denied' };
      Object.assign(alvo, patch); save(d);
    },
    async getConfig(){ return DB().config || { cadastroAberto: false }; },
    async setConfig(patch){ need(); const d = DB(); d.config = Object.assign(d.config || {}, patch); save(d); },
    async listAutorizados(){ need(); return Object.keys(DB().autorizados); },
    async addAutorizado(e){ need(); const d = DB(); d.autorizados[e.toLowerCase()] = { por: cur() }; save(d); },
    async delAutorizado(e){ need(); const d = DB(); delete d.autorizados[e.toLowerCase()]; save(d); },
    async listShared(){ return Object.keys(DB().respostas).map(k => Object.assign({ id: k }, DB().respostas[k])); },
    async saveShared(id, x){ need(); const d = DB(); d.respostas[id || rid()] = { grupo: x.grupo, titulo: x.titulo, texto: x.texto, oculta: !!x.oculta, atualizado: Date.now(), por: cur() }; save(d); },
    async deleteShared(id){ need(); const d = DB(); delete d.respostas[id]; save(d); },
    async list(){ return (DB().notas[cur()] || []).slice(); },
    async save(n){
      const d = DB(), l = d.notas[cur()] = d.notas[cur()] || [];
      const data = { titulo: n.titulo, texto: n.texto, categoria: n.categoria || '', atualizado: Date.now() };
      if (n.id){ const i = l.findIndex(x => x.id === n.id); if (i > -1) l[i] = Object.assign({ id: n.id }, data); }
      else l.push(Object.assign({ id: 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) }, data));
      save(d);
    },
    async del(id){ const d = DB(); d.notas[cur()] = (d.notas[cur()] || []).filter(x => x.id !== id); save(d); }
  };
}

/* =============== estado =============== */
let B = null, user = null, perfil = null, notes = [], shared = {}, gateMsg = null, authSeq = 0;
const isAdmin = () => !!perfil && perfil.papel === 'admin';
const isGestao = () => !!perfil && (perfil.papel === 'admin' || perfil.papel === 'gestor');   /* gestor e administrador têm os mesmos acessos */
const PAPEL = { admin: 'Administrador', gestor: 'Gestor', operador: 'Operador' };
const nomeUser = () => (perfil && perfil.nome) || (user && user.email) || '';

/* ---------- perfil: salvar com atraso (favoritos, contadores, ordem, nome, tema) ---------- */
let pend = null, pendT = null;
function salvarPerfil(patch){
  Object.assign(perfil, patch); pend = Object.assign(pend || {}, patch);
  clearTimeout(pendT);
  pendT = setTimeout(flushPerfil, 900);
}
async function flushPerfil(){
  if (!pend || !B) return; const p = pend; pend = null; clearTimeout(pendT);
  try { await B.updateProfile(p); } catch (e) { UI.toast(erroMsg(e), 'err'); }
}
window.addEventListener('pagehide', flushPerfil);

/* =============== modelo: respostas originais + compartilhadas + anotações =============== */
function sortedNotes(){
  const pos = {}; ((perfil && perfil.ordem) || []).forEach((id, i) => pos[id] = i);
  return notes.slice().sort((a, b) => ((pos[a.id] ?? 1e9) - (pos[b.id] ?? 1e9)) || a.titulo.localeCompare(b.titulo, 'pt-BR'));
}
function notesGroups(){
  const cats = {};
  sortedNotes().forEach(n => { const c = (n.categoria || '').trim(); (cats[c] = cats[c] || []).push(n); });
  return Object.keys(cats).sort((a, b) => a === '' ? -1 : b === '' ? 1 : a.localeCompare(b, 'pt-BR')).map(c => {
    const title = c ? GRUPO + ' · ' + c : GRUPO;
    META[title] = META[title] || { ico: '📝', c: '#0d3b66' };
    return { title, items: cats[c].map(n => ({ id: 'nota_' + n.id, label: n.titulo, text: n.texto })) };
  });
}
const PALETA = ['#1a4f88', '#00838f', '#CC5500', '#2e7d32', '#6a1b9a', '#c2185b', '#455a64'];
function baseModel(){
  const groups = BASE_GROUPS.map(g => ({ title: g.title, items: g.items.map(i => ({ id: i.id, label: i.label, text: BASE_TEXTOS[i.id] || '' })) }));
  const gOf = t => {
    let g = groups.find(x => x.title === t);
    if (!g){ g = { title: t, items: [] }; groups.push(g); if (!META[t]) META[t] = { ico: '💬', c: PALETA[groups.length % PALETA.length] }; }
    return g;
  };
  Object.values(shared).sort((a, b) => (a.atualizado || 0) - (b.atualizado || 0)).forEach(d => {
    const isBase = BASE_IDS.has(d.id);
    let from = null, it = null;
    groups.forEach(g => { const k = g.items.findIndex(x => x.id === d.id); if (k > -1){ from = g; it = g.items[k]; } });
    if (d.oculta){ if (from) from.items.splice(from.items.indexOf(it), 1); return; }
    if (isBase && it){
      it.label = d.titulo; it.text = d.texto; it.over = true;
      if (d.grupo && d.grupo !== from.title){ from.items.splice(from.items.indexOf(it), 1); gOf(d.grupo).items.push(it); }
    } else gOf(d.grupo || 'Compartilhadas').items.push({ id: d.id, label: d.titulo, text: d.texto, novo: true });
  });
  return groups.filter(g => g.items.length);
}
function textoFinal(id, texto){
  if (perfil && perfil.nome && BASE_IDS.has(id) && texto === BASE_TEXTOS[id]) return texto.replace(/Me chamo Rauan/g, 'Me chamo ' + perfil.nome);
  return texto;
}
function rebuild(){
  const all = (perfil ? notesGroups() : []).concat(perfil ? baseModel() : BASE_GROUPS.map(g => ({ title: g.title, items: g.items.map(i => ({ id: i.id, label: i.label, text: BASE_TEXTOS[i.id] || '' })) })));
  GROUPS.length = 0; all.forEach(g => GROUPS.push({ title: g.title, items: g.items.map(i => ({ id: i.id, label: i.label })) }));
  ITEMS.length = 0;
  Object.keys(byId).forEach(k => delete byId[k]); Object.keys(TEXTOS).forEach(k => delete TEXTOS[k]);
  all.forEach(g => g.items.forEach(i => {
    const text = textoFinal(i.id, i.text), it = { id: i.id, label: i.label, g: g.title, text };
    it.nq = UI.norm(it.label + ' ' + text); ITEMS.push(it); byId[it.id] = it; TEXTOS[it.id] = text;
  }));
  if (state.g !== 'all' && state.g !== FAV && !GROUPS.some(g => g.title === state.g)) state.g = 'all';
  recent = recent.filter(id => byId[id]);
  renderRecent(); render();
}

/* =============== cards: favoritos, contador de uso, editar/duplicar/excluir =============== */
const renderOriginal = render;
render = function(){ renderOriginal(); decorar(); };

function decorar(){
  const lista = q('#lista'), chips = q('#chips');
  if (!perfil) return;
  const favIds = (perfil.favoritos || []).filter(id => byId[id]);
  if (chips && chips.firstElementChild)
    chips.firstElementChild.insertAdjacentHTML('afterend',
      `<button class="chip ${state.g === FAV ? 'active' : ''}" style="--c:#f59e0b" data-g="${FAV}"><i></i>⭐ Favoritos <em>${favIds.length}</em></button>`);
  const qn = UI.norm(state.q.trim());
  const favItems = favIds.map(id => byId[id]).filter(i => !qn || i.nq.includes(qn));
  const sec = () => `<section class="section" style="--c:#f59e0b;--bg-c:#f59e0b1f">
      <div class="sec-head"><h2>⭐ Favoritos</h2><span class="count-pill">${favItems.length}</span></div>
      <div class="tpl-grid">${favItems.map(card).join('')}</div></section>`;
  if (state.g === FAV){
    lista.innerHTML = favItems.length ? sec() : '<div class="nothing"><big>⭐</big>Nenhum favorito ainda. Clique na ☆ de uma resposta para fixá-la aqui.</div>';
    q('#kTotal').textContent = favItems.length; q('#kGroups').textContent = new Set(favItems.map(i => i.g)).size;
  } else if (state.g === 'all' && favItems.length) lista.insertAdjacentHTML('afterbegin', sec());

  qa('.tpl[data-copy]', lista).forEach(c => {
    const id = c.dataset.copy, acts = q('.acts', c); if (!acts) return;
    const fav = favIds.includes(id), n = (perfil.usos || {})[id] || 0;
    let h = `<button class="btn ghost fav ${fav ? 'on' : ''}" data-fav="${esc(id)}" type="button" title="${fav ? 'Remover dos favoritos' : 'Favoritar'}" aria-pressed="${fav}">${fav ? '★' : '☆'}</button>`;
    if (id.startsWith('nota_')){
      const nid = id.slice(5);
      h += `<button class="btn ghost" data-nedit="${esc(nid)}" type="button" title="Editar">✏️</button>
            <button class="btn ghost" data-ndup="${esc(nid)}" type="button" title="Duplicar">⧉</button>
            <button class="btn ghost" data-ndel="${esc(nid)}" type="button" title="Excluir">🗑</button>`;
    }
    acts.insertAdjacentHTML('beforeend', h);
    if (n && c.firstElementChild) c.firstElementChild.insertAdjacentHTML('beforeend', `<span class="uso-pill" title="Vezes que você copiou">×${n}</span>`);
  });
}
/* captura antes do clique de "copiar" do card */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-fav],[data-nedit],[data-ndup],[data-ndel]'); if (!b) return;
  e.stopPropagation();
  if (b.dataset.fav){
    const id = b.dataset.fav, f = (perfil.favoritos || []).slice(), i = f.indexOf(id);
    i > -1 ? f.splice(i, 1) : f.push(id);
    salvarPerfil({ favoritos: f }); render();
  }
  else if (b.dataset.nedit) openPanel('notas', b.dataset.nedit);
  else if (b.dataset.ndup) duplicarNota(b.dataset.ndup);
  else removerNota(b.dataset.ndel);
}, true);

/* ---------- campos variáveis: {nome}, {data}, {operador} ---------- */
const VAR_RE = /\{([A-Za-zÀ-ÿ0-9_ ]{1,30})\}/g;
const AUTO = { data: () => new Date().toLocaleDateString('pt-BR'), operador: () => (perfil && perfil.nome) || '' };
const autoVal = v => (AUTO[UI.norm(v)] ? AUTO[UI.norm(v)]() : '');
function variaveis(t){ const s = new Set(); t.replace(VAR_RE, (m, v) => { s.add(v.trim()); return m; }); return [...s]; }
const preencher = (t, vals) => t.replace(VAR_RE, (m, v) => { v = v.trim(); return (v in vals) ? vals[v] : (autoVal(v) || m); });

function registrarUso(id){
  const u = Object.assign({}, perfil.usos || {}); u[id] = (u[id] || 0) + 1;
  salvarPerfil({ usos: u }); render();
}
copyItem = function(id){
  const it = byId[id]; if (!it) return;
  const falta = variaveis(it.text).filter(v => !autoVal(v));
  const fim = vals => { UI.copy(preencher(it.text, vals), 'Copiado: ' + it.label); use(id); if (perfil) registrarUso(id); };
  if (!falta.length) return fim({});
  setTimeout(() => {                      /* depois de qualquer janela que esteja fechando */
    const m = UI.openModal({
      title: 'Preencher campos', sub: it.label,
      html: `<form id="varForm" novalidate>${falta.map(v => `<label class="au-f"><span>${esc(v)}</span><input class="au-plain" data-v="${esc(v)}" autocomplete="off"></label>`).join('')}
        <button class="btn" type="submit">📋 Copiar</button></form>`
    });
    const f = q('#varForm', m.body); q('input', f).focus();
    f.onsubmit = ev => {
      ev.preventDefault(); const vals = {};
      qa('input', f).forEach(i => vals[i.dataset.v] = i.value.trim() || '{' + i.dataset.v + '}');
      UI.closeModal(); fim(vals);
    };
  }, 0);
};

/* =============== anotações: carregar / excluir / duplicar =============== */
async function loadNotes(){
  try { notes = await B.list(); } catch (e) { notes = []; UI.toast(erroMsg(e), 'err'); }
}
async function loadShared(){
  try { shared = Object.fromEntries((await B.listShared()).map(d => [d.id, d])); }
  catch (e) { shared = {}; UI.toast(erroMsg(e), 'err'); }
}
async function removerNota(id){
  const x = notes.find(y => y.id === id);
  if (!x || !confirm('Excluir a anotação "' + x.titulo + '"?')) return false;
  try {
    await B.del(x.id); await loadNotes();
    const nid = 'nota_' + id;
    salvarPerfil({ favoritos: (perfil.favoritos || []).filter(f => f !== nid), ordem: (perfil.ordem || []).filter(o => o !== id) });
    rebuild(); UI.toast('Anotação excluída'); return true;
  } catch (e) { UI.toast(erroMsg(e), 'err'); return false; }
}
async function duplicarNota(id){
  const x = notes.find(y => y.id === id); if (!x) return false;
  const suf = ' (cópia)', titulo = (x.titulo.length + suf.length > 80 ? x.titulo.slice(0, 80 - suf.length) : x.titulo) + suf;
  try { await B.save({ titulo, texto: x.texto, categoria: x.categoria }); await loadNotes(); rebuild(); UI.toast('Anotação duplicada'); return true; }
  catch (e) { UI.toast(erroMsg(e), 'err'); return false; }
}

function showMsg(el, kind, text){ el.className = 'au-msg show ' + kind; el.textContent = text; }
const eyeBtn = '<button type="button" class="au-eye" aria-label="Mostrar/ocultar senha" tabindex="-1">👁</button>';

function buildGate(){
  const g = document.createElement('div');
  g.className = 'au-gate'; g.id = 'authGate';
  g.innerHTML = `<form class="au-card" id="auForm" novalidate>
    <h1>Anotações</h1>
    <p class="au-sub">Entre para acessar suas respostas e anotações.</p>
    <div class="au-tabs" role="tablist">
      <button type="button" class="active" data-m="in">Entrar</button>
      <button type="button" data-m="up">Criar conta</button>
    </div>
    <div class="au-msg" id="auMsg" role="alert"></div>
    <label class="au-f"><span>E-mail (login)</span><input class="au-plain" id="auEmail" type="email" autocomplete="username" required></label>
    <label class="au-f"><span>Senha</span><div class="au-in"><input id="auPw" type="password" autocomplete="current-password" required>${eyeBtn}</div></label>
    <div id="auUp" class="hidden">
      <label class="au-f"><span>Confirmar senha</span><div class="au-in"><input id="auPw2" type="password" autocomplete="new-password">${eyeBtn}</div></label>
      ${rulesHTML()}
      <p class="au-note" style="margin:-4px 0 14px;text-align:left">Seu e-mail precisa ter sido autorizado pelo gestor. A primeira conta do sistema vira administrador automaticamente.</p>
    </div>
    <button class="btn au-go" id="auGo" type="submit">Entrar</button>
    <button class="au-link" id="auForgot" type="button">Esqueci minha senha</button>
    ${B.mode === 'local' ? '<p class="au-msg warn show" style="margin:14px 0 0">Modo de teste local: banco de dados ainda não vinculado. As contas ficam apenas neste navegador.</p>' : ''}
  </form>`;
  document.getElementById('conteudo').insertAdjacentElement('beforebegin', g);

  let mode = 'in';
  const form = q('#auForm', g), msg = q('#auMsg', g), pw = q('#auPw', g), go = q('#auGo', g);
  if (gateMsg){ showMsg(msg, 'err', gateMsg); gateMsg = null; }
  bindRules(pw, q('.au-rules', g));
  qa('.au-tabs button', g).forEach(b => b.onclick = () => {
    mode = b.dataset.m;
    qa('.au-tabs button', g).forEach(x => x.classList.toggle('active', x === b));
    q('#auUp', g).classList.toggle('hidden', mode !== 'up');
    q('#auForgot', g).classList.toggle('hidden', mode === 'up');
    go.textContent = mode === 'up' ? 'Criar conta' : 'Entrar';
    pw.autocomplete = mode === 'up' ? 'new-password' : 'current-password';
    msg.className = 'au-msg';
  });
  q('#auForgot', g).onclick = async () => {
    const email = q('#auEmail', g).value.trim();
    if (!email) return showMsg(msg, 'err', 'Digite seu e-mail para receber o link de redefinição.');
    try { await B.reset(email); showMsg(msg, 'ok', 'Se o e-mail estiver cadastrado, enviamos um link para redefinir a senha.'); }
    catch (e) { showMsg(msg, 'err', erroMsg(e)); }
  };
  form.onsubmit = async ev => {
    ev.preventDefault();
    const email = q('#auEmail', g).value.trim(), p = pw.value;
    if (!email || !p) return showMsg(msg, 'err', 'Preencha e-mail e senha.');
    if (mode === 'up'){
      if (!pwValid(p)) return showMsg(msg, 'err', 'A senha não atende aos requisitos abaixo.');
      if (p !== q('#auPw2', g).value) return showMsg(msg, 'err', 'As senhas não conferem.');
    }
    go.disabled = true;
    try { await (mode === 'up' ? B.signUp(email, p) : B.signIn(email, p)); }
    catch (e) { showMsg(msg, 'err', erroMsg(e)); }
    go.disabled = false;
  };
}

function tabsDef(){
  const t = [['notas', '📝 Anotações'], ['uso', '📊 Uso'], ['perfil', '👤 Perfil'], ['senha', '🔒 Senha'], ['backup', '💾 Backup']];
  if (isGestao()) t.push(['respostas', '📚 Respostas'], ['usuarios', '👥 Usuários']);
  return t;
}
function openPanel(tab, arg){
  const m = UI.openModal({
    title: 'Painel de controle', sub: user.email + ' · ' + (PAPEL[perfil.papel] || 'Operador'), size: 'wide',
    html: `<div class="au-panel-tabs">${tabsDef().map(([k, l]) => `<button type="button" data-t="${k}">${l}</button>`).join('')}</div><div id="auBody"></div>`,
    foot: '<button class="btn danger" id="auOut" type="button">Sair da conta</button>'
  });
  const body = q('#auBody', m.body);
  const FN = { notas: tabNotas, uso: tabUso, perfil: tabPerfil, senha: tabSenha, backup: tabBackup, respostas: tabRespostas, usuarios: tabUsuarios };
  const setTab = (t, a) => { qa('.au-panel-tabs button', m.body).forEach(b => b.classList.toggle('active', b.dataset.t === t)); FN[t](body, a); };
  qa('.au-panel-tabs button', m.body).forEach(b => b.onclick = () => setTab(b.dataset.t));
  q('#auOut', m.foot).onclick = async () => { UI.closeModal(); await flushPerfil(); await B.signOut(); };
  setTab(tab || 'notas', arg);
}
const catsOrdenadas = list => [...new Set(list)].sort((a, b) => a === '' ? -1 : b === '' ? 1 : a.localeCompare(b, 'pt-BR'));

/* ---------- Anotações ---------- */
function tabNotas(box, editing){
  const n = editing && notes.find(x => x.id === editing);
  const by = {}; sortedNotes().forEach(x => { const c = (x.categoria || '').trim(); (by[c] = by[c] || []).push(x); });
  const keys = catsOrdenadas(Object.keys(by));
  const item = (x, i, len) => `<div class="au-item" draggable="true" data-id="${esc(x.id)}">
      <span class="au-grip" title="Arraste para reordenar">⋮⋮</span>
      <div class="au-main"><b>${esc(x.titulo)}</b><small>${esc(x.texto.replace(/\s+/g, ' '))}</small></div>
      <div class="au-acts">
        <button class="btn ghost" data-up="${esc(x.id)}" type="button" title="Mover para cima" ${i === 0 ? 'disabled' : ''}>▲</button>
        <button class="btn ghost" data-down="${esc(x.id)}" type="button" title="Mover para baixo" ${i === len - 1 ? 'disabled' : ''}>▼</button>
        <button class="btn ghost" data-ed="${esc(x.id)}" type="button">✏️ Editar</button>
        <button class="btn ghost" data-dup="${esc(x.id)}" type="button">⧉ Duplicar</button>
        <button class="btn ghost" data-rm="${esc(x.id)}" type="button">🗑 Excluir</button>
      </div></div>`;
  box.innerHTML = `
    <div class="au-list">${notes.length ? keys.map(c => (keys.length > 1 || c ? `<div class="au-cat">${esc(c || 'Sem categoria')}</div>` : '') + by[c].map((x, i) => item(x, i, by[c].length)).join('')).join('')
      : '<div class="au-empty">Você ainda não tem anotações. Crie a primeira abaixo.</div>'}</div>
    <hr class="au-sep">
    <div class="au-msg" id="nMsg" role="alert"></div>
    <label class="au-f"><span>${n ? 'Editar anotação' : 'Nova anotação'} — título</span><input class="au-plain" id="nTit" maxlength="80" value="${n ? esc(n.titulo) : ''}"></label>
    <label class="au-f"><span>Categoria (opcional)</span><input class="au-plain" id="nCat" maxlength="40" list="catList" value="${n ? esc(n.categoria || '') : ''}" placeholder="Ex.: Convênios, Retornos">
      <datalist id="catList">${keys.filter(Boolean).map(c => `<option value="${esc(c)}">`).join('')}</datalist></label>
    <label class="au-f"><span>Texto — use *texto* para negrito e {campo} para preencher na hora de copiar</span><textarea id="nTxt" maxlength="5000">${n ? esc(n.texto) : ''}</textarea></label>
    <div style="display:flex;gap:8px"><button class="btn" id="nSave" type="button">💾 Salvar</button>
    ${n ? '<button class="btn ghost" id="nCancel" type="button">Cancelar</button>' : ''}</div>`;

  qa('[data-ed]', box).forEach(b => b.onclick = () => tabNotas(box, b.dataset.ed));
  qa('[data-rm]', box).forEach(b => b.onclick = async () => { if (await removerNota(b.dataset.rm)) tabNotas(box); });
  qa('[data-dup]', box).forEach(b => b.onclick = async () => { if (await duplicarNota(b.dataset.dup)) tabNotas(box); });
  qa('[data-up]', box).forEach(b => b.onclick = () => mover(b.dataset.up, -1, box));
  qa('[data-down]', box).forEach(b => b.onclick = () => mover(b.dataset.down, 1, box));
  let dragId = null;
  qa('.au-item[draggable]', box).forEach(el => {
    el.ondragstart = e => { dragId = el.dataset.id; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (x) {} el.classList.add('drag'); };
    el.ondragend = () => el.classList.remove('drag');
    el.ondragover = e => { if (dragId) e.preventDefault(); };
    el.ondrop = e => { e.preventDefault(); if (dragId && dragId !== el.dataset.id) arrastar(dragId, el.dataset.id, box); dragId = null; };
  });
  if (n){ const f = q('#nTit', box); f.scrollIntoView({ block: 'center' }); f.focus(); }
  const c = q('#nCancel', box); if (c) c.onclick = () => tabNotas(box);
  q('#nSave', box).onclick = async () => {
    const titulo = q('#nTit', box).value.trim(), texto = q('#nTxt', box).value.trim(), categoria = q('#nCat', box).value.trim(), msg = q('#nMsg', box);
    if (!titulo || !texto) return showMsg(msg, 'err', 'Preencha o título e o texto.');
    try { await B.save({ id: n && n.id, titulo, texto, categoria }); await loadNotes(); rebuild(); tabNotas(box); UI.toast('Anotação salva'); }
    catch (e) { showMsg(msg, 'err', erroMsg(e)); }
  };
}
const catDe = id => ((notes.find(x => x.id === id) || {}).categoria || '').trim();
function novaOrdem(box, ord){ salvarPerfil({ ordem: ord }); rebuild(); tabNotas(box); }
function mover(id, dir, box){
  const ord = sortedNotes().map(x => x.id), L = ord.filter(x => catDe(x) === catDe(id));
  const i = L.indexOf(id), j = i + dir; if (j < 0 || j >= L.length) return;
  const a = ord.indexOf(L[i]), b = ord.indexOf(L[j]); [ord[a], ord[b]] = [ord[b], ord[a]];
  novaOrdem(box, ord);
}
function arrastar(id, alvo, box){
  if (catDe(id) !== catDe(alvo)) return UI.toast('Arraste dentro da mesma categoria', 'err');
  const ord = sortedNotes().map(x => x.id).filter(x => x !== id); ord.splice(ord.indexOf(alvo), 0, id);
  novaOrdem(box, ord);
}

/* ---------- Uso (contadores) ---------- */
function tabUso(box){
  const usos = perfil.usos || {}, todos = ITEMS.map(i => ({ i, n: usos[i.id] || 0 }));
  const top = todos.filter(x => x.n).sort((a, b) => b.n - a.n).slice(0, 10), nunca = todos.filter(x => !x.n);
  const max = top.length ? top[0].n : 1, total = todos.reduce((s, x) => s + x.n, 0);
  box.innerHTML = `
    <p class="au-sub" style="margin-top:0">Quantas vezes <b>você</b> copiou cada resposta. Total de cópias: <b>${total}</b>.</p>
    <div class="au-cat">Mais usadas</div>
    ${top.length ? top.map(x => `<div class="au-bar"><span>${esc(x.i.label)}</span><div><i style="width:${Math.max(6, x.n / max * 100)}%"></i></div><b>${x.n}</b></div>`).join('') : '<div class="au-empty">Ainda não há cópias registradas.</div>'}
    <div class="au-cat" style="margin-top:18px">Nunca usadas (${nunca.length})</div>
    <div class="au-tags">${nunca.map(x => `<span>${esc(x.i.label)}</span>`).join('') || '—'}</div>
    <div style="margin-top:18px"><button class="btn ghost" id="uZero" type="button">Zerar contadores</button></div>`;
  q('#uZero', box).onclick = () => { if (!confirm('Zerar todos os contadores de uso?')) return; salvarPerfil({ usos: {} }); render(); tabUso(box); };
}

/* ---------- Perfil ---------- */
function tabPerfil(box){
  const ver = B.mode === 'firebase' ? (B.verified()
    ? '<div class="au-msg ok show">✔ E-mail verificado</div>'
    : `<div class="au-msg warn show">E-mail ainda não verificado. Enviamos um link de confirmação para ${esc(user.email)}.</div>
       <div style="display:flex;gap:8px;margin-bottom:14px"><button class="btn ghost" id="fReenv" type="button">Reenviar e-mail</button><button class="btn ghost" id="fJa" type="button">Já verifiquei</button></div>`)
    : '<div class="au-msg warn show">Verificação de e-mail indisponível no modo de teste local.</div>';
  box.innerHTML = `<div style="max-width:460px">
    <div class="au-msg" id="fMsg" role="alert"></div>
    <label class="au-f"><span>Nome de exibição</span><input class="au-plain" id="fNome" maxlength="40" value="${esc(perfil.nome || '')}" placeholder="Ex.: Digite o seu nome..."></label>
    <p class="au-note" style="text-align:left;margin:-8px 0 12px">Entra no lugar de "Rauan" nas saudações prontas e no campo <code>{operador}</code>.</p>
    <button class="btn" id="fNomeSave" type="button">💾 Salvar nome</button>
    <hr class="au-sep" style="margin-top:18px">
    <div class="au-f"><span>Tema</span><div class="au-panel-tabs" style="margin:0">
      <button type="button" data-tema="light" class="${temaAtual() === 'light' ? 'active' : ''}">☀️ Claro</button>
      <button type="button" data-tema="dark" class="${temaAtual() === 'dark' ? 'active' : ''}">🌙 Escuro</button></div></div>
    <div class="au-f"><span>Perfil de acesso</span><b>${isAdmin() ? 'Administrador (acesso total: respostas compartilhadas, usuários e perfis)' : isGestao() ? 'Gestor (edita respostas e gerencia usuários)' : 'Operador (usa as respostas e tem as próprias anotações)'}</b></div>
    ${ver}
    <hr class="au-sep">
    <div class="au-f"><span style="color:var(--vermelho)">Excluir minha conta</span>
      <p class="au-note" style="text-align:left;margin:0 0 10px">Apaga seu login, suas anotações e suas preferências. Não pode ser desfeito.${isGestao() ? ' <b>Gestores e administradores não podem excluir a própria conta. Peça a outra pessoa da gestão para mudar seu perfil para operador antes.</b>' : ''}</p>
      <div class="au-in"><input id="fDelPw" type="password" placeholder="Digite sua senha para confirmar" autocomplete="current-password" ${isGestao() ? 'disabled' : ''}>${eyeBtn}</div></div>
    <button class="btn danger" id="fDel" type="button" ${isGestao() ? 'disabled' : ''}>🗑 Excluir minha conta</button></div>`;
  const msg = q('#fMsg', box);
  q('#fNomeSave', box).onclick = () => {
    salvarPerfil({ nome: q('#fNome', box).value.trim() }); atualizarUserBtn(); rebuild(); showMsg(msg, 'ok', 'Nome salvo.');
  };
  qa('[data-tema]', box).forEach(b => b.onclick = () => { aplicarTema(b.dataset.tema); salvarPerfil({ tema: b.dataset.tema }); tabPerfil(box); });
  const re = q('#fReenv', box); if (re) re.onclick = async () => { try { await B.sendVerification(); showMsg(msg, 'ok', 'E-mail reenviado. Confira também a caixa de spam.'); } catch (e) { showMsg(msg, 'err', erroMsg(e)); } };
  const ja = q('#fJa', box); if (ja) ja.onclick = async () => { try { (await B.reloadUser()) ? tabPerfil(box) : showMsg(msg, 'err', 'Ainda não consta como verificado.'); } catch (e) { showMsg(msg, 'err', erroMsg(e)); } };
  q('#fDel', box).onclick = async () => {
    const p = q('#fDelPw', box).value;
    if (!p) return showMsg(msg, 'err', 'Digite sua senha para confirmar.');
    if (!confirm('Excluir DEFINITIVAMENTE sua conta e todas as suas anotações?')) return;
    try { await flushPerfil(); await B.deleteAccount(p); UI.closeModal(); UI.toast('Conta excluída'); }
    catch (e) { showMsg(msg, 'err', erroMsg(e)); }
  };
}

/* ---------- Alterar senha ---------- */
function tabSenha(box){
  box.innerHTML = `<form id="pwForm" novalidate style="max-width:420px">
    <div class="au-msg" id="pMsg" role="alert"></div>
    <input type="text" autocomplete="username" value="${esc(user.email)}" hidden>
    <label class="au-f"><span>Senha atual</span><div class="au-in"><input id="pCur" type="password" autocomplete="current-password">${eyeBtn}</div></label>
    <label class="au-f"><span>Nova senha</span><div class="au-in"><input id="pNew" type="password" autocomplete="new-password">${eyeBtn}</div></label>
    <label class="au-f"><span>Confirmar nova senha</span><div class="au-in"><input id="pNew2" type="password" autocomplete="new-password">${eyeBtn}</div></label>
    ${rulesHTML()}
    <button class="btn" type="submit">🔒 Alterar senha</button></form>`;
  bindRules(q('#pNew', box), q('.au-rules', box));
  q('#pwForm', box).onsubmit = async ev => {
    ev.preventDefault();
    const cur = q('#pCur', box).value, nw = q('#pNew', box).value, msg = q('#pMsg', box);
    if (!cur) return showMsg(msg, 'err', 'Informe a senha atual.');
    if (!pwValid(nw)) return showMsg(msg, 'err', 'A nova senha não atende aos requisitos abaixo.');
    if (nw !== q('#pNew2', box).value) return showMsg(msg, 'err', 'As senhas não conferem.');
    if (nw === cur) return showMsg(msg, 'err', 'A nova senha deve ser diferente da atual.');
    try { await B.changePw(cur, nw); ev.target.reset(); qa('.au-rules li', box).forEach(li => li.classList.remove('ok')); showMsg(msg, 'ok', 'Senha alterada com sucesso!'); }
    catch (e) { showMsg(msg, 'err', erroMsg(e)); }
  };
}

/* ---------- Backup (exportar / importar anotações) ---------- */
function tabBackup(box){
  box.innerHTML = `<div style="max-width:520px"><div class="au-msg" id="bMsg" role="alert"></div>
    <p class="au-sub" style="margin-top:0">Salve suas anotações em um arquivo ou passe-as para outra pessoa.</p>
    <button class="btn" id="bExp" type="button">⬇️ Exportar minhas anotações</button>
    <hr class="au-sep" style="margin-top:18px">
    <label class="au-f"><span>Importar arquivo de anotações (.json)</span><input class="au-plain" id="bImp" type="file" accept=".json,application/json"></label>
    <p class="au-note" style="text-align:left">As anotações importadas são <b>somadas</b> às que você já tem; as repetidas são ignoradas.</p></div>`;
  const msg = q('#bMsg', box);
  q('#bExp', box).onclick = () => {
    const data = { app: 'anotacoes', versao: 1, exportado: new Date().toISOString(),
      notas: notes.map(n => ({ titulo: n.titulo, texto: n.texto, categoria: n.categoria || '' })) };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.download = 'anotacoes-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    showMsg(msg, 'ok', notes.length + ' anotação(ões) exportada(s).');
  };
  q('#bImp', box).onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!d || !Array.isArray(d.notas)) throw new Error('Arquivo inválido: não encontrei a lista de anotações.');
      if (d.notas.length > 500) throw new Error('Arquivo com anotações demais (máximo 500).');
      const chave = n => [n.titulo, n.texto, (n.categoria || '').trim()].join('\u0001');
      const tem = new Set(notes.map(chave)); let ok = 0, ign = 0;
      for (const x of d.notas){
        const n = { titulo: String(x.titulo || '').trim().slice(0, 80), texto: String(x.texto || '').trim().slice(0, 5000), categoria: String(x.categoria || '').trim().slice(0, 40) };
        if (!n.titulo || !n.texto || tem.has(chave(n))){ ign++; continue; }
        await B.save(n); tem.add(chave(n)); ok++;
      }
      await loadNotes(); rebuild(); showMsg(msg, 'ok', ok + ' importada(s), ' + ign + ' ignorada(s).');
    } catch (e) { showMsg(msg, 'err', (e && e.message) || 'Não foi possível importar o arquivo.'); }
    ev.target.value = '';
  };
}

/* ---------- Respostas compartilhadas (gestor) ---------- */
function tabRespostas(box, editId){
  const model = baseModel(), flat = model.flatMap(g => g.items.map(i => Object.assign({ grupo: g.title }, i)));
  const ed = editId && flat.find(x => x.id === editId);
  const ocultas = Object.values(shared).filter(d => d.oculta);
  const row = i => `<div class="au-item"><div class="au-main"><b>${esc(i.label)}</b>
      <small>${i.novo ? 'Criada pela gestão' : i.over ? 'Original ajustada pela gestão' : 'Original do sistema'}</small></div>
      <div class="au-acts"><button class="btn ghost" data-sed="${esc(i.id)}" type="button">✏️ Editar</button>
      ${i.novo ? `<button class="btn ghost" data-sdel="${esc(i.id)}" type="button">🗑 Excluir</button>`
        : `${i.over ? `<button class="btn ghost" data-sres="${esc(i.id)}" type="button">♻ Restaurar original</button>` : ''}<button class="btn ghost" data-shide="${esc(i.id)}" type="button">🙈 Ocultar</button>`}
      </div></div>`;
  box.innerHTML = `
    <p class="au-sub" style="margin-top:0">As mudanças feitas aqui valem para <b>todos os usuários</b> (operadores e gestores).</p>
    <div class="au-msg" id="sMsg" role="alert"></div>
    <label class="au-f"><span>${ed ? 'Editar resposta' : 'Nova resposta compartilhada'} — categoria</span>
      <input class="au-plain" id="sGrp" maxlength="60" list="grpList" value="${ed ? esc(ed.grupo) : ''}" placeholder="Ex.: Informações">
      <datalist id="grpList">${model.map(g => `<option value="${esc(g.title)}">`).join('')}</datalist></label>
    <label class="au-f"><span>Título (botão)</span><input class="au-plain" id="sTit" maxlength="80" value="${ed ? esc(ed.label) : ''}"></label>
    <label class="au-f"><span>Texto — *texto* para negrito; {campo} é preenchido na hora de copiar; {operador} e {data} entram sozinhos</span><textarea id="sTxt" maxlength="5000">${ed ? esc(ed.text) : ''}</textarea></label>
    <div style="display:flex;gap:8px"><button class="btn" id="sSave" type="button">💾 Salvar para todos</button>${ed ? '<button class="btn ghost" id="sCancel" type="button">Cancelar</button>' : ''}</div>
    <hr class="au-sep" style="margin-top:18px">
    ${model.map(g => `<div class="au-cat">${esc(g.title)}</div>${g.items.map(row).join('')}`).join('')}
    ${ocultas.length ? `<div class="au-cat" style="margin-top:14px">Ocultas (${ocultas.length})</div>${ocultas.map(d => `<div class="au-item"><div class="au-main"><b>${esc(d.titulo)}</b><small>Oculta para todos</small></div>
      <div class="au-acts"><button class="btn ghost" data-sres="${esc(d.id)}" type="button">♻ Reexibir</button></div></div>`).join('')}` : ''}`;
  const msg = q('#sMsg', box);
  const done = async txt => { await loadShared(); rebuild(); tabRespostas(box); UI.toast(txt); };
  const run = async (fn, txt) => { try { await fn(); await done(txt); } catch (e) { showMsg(q('#sMsg', box), 'err', erroMsg(e)); } };
  qa('[data-sed]', box).forEach(b => b.onclick = () => { tabRespostas(box, b.dataset.sed); q('#sTit', box).scrollIntoView({ block: 'center' }); q('#sTit', box).focus(); });
  qa('[data-shide]', box).forEach(b => b.onclick = () => { const i = flat.find(x => x.id === b.dataset.shide); run(() => B.saveShared(i.id, { grupo: i.grupo, titulo: i.label, texto: i.text, oculta: true }), 'Resposta ocultada'); });
  qa('[data-sres]', box).forEach(b => b.onclick = () => run(() => B.deleteShared(b.dataset.sres), 'Restaurado'));
  qa('[data-sdel]', box).forEach(b => b.onclick = () => { if (confirm('Excluir esta resposta para todos?')) run(() => B.deleteShared(b.dataset.sdel), 'Resposta excluída'); });
  const c = q('#sCancel', box); if (c) c.onclick = () => tabRespostas(box);
  q('#sSave', box).onclick = () => {
    const grupo = q('#sGrp', box).value.trim(), titulo = q('#sTit', box).value.trim(), texto = q('#sTxt', box).value.trim();
    if (!grupo || !titulo || !texto) return showMsg(msg, 'err', 'Preencha categoria, título e texto.');
    if (grupo.startsWith(GRUPO)) return showMsg(msg, 'err', 'Essa categoria é reservada para as anotações pessoais.');
    run(() => B.saveShared(ed ? ed.id : null, { grupo, titulo, texto, oculta: false }), 'Resposta salva para todos');
  };
}

/* ---------- Usuários (gestor) ---------- */
async function tabUsuarios(box){
  box.innerHTML = '<div class="au-empty">Carregando…</div>';
  let us, aut, cfg;
  try { [us, aut, cfg] = await Promise.all([B.listUsers(perfil.papel), B.listAutorizados(), B.getConfig()]); }
  catch (e) { box.innerHTML = `<div class="au-msg err show">${esc(erroMsg(e))}</div>`; return; }
  if (!isAdmin()) us = us.filter(u => u.papel !== 'admin');          /* o gestor nunca vê administradores */
  us.sort((a, b) => a.email.localeCompare(b.email));
  const opt = (v, atual) => `<option value="${v}" ${atual === v ? 'selected' : ''}>${PAPEL[v]}</option>`;
  box.innerHTML = `<div class="au-msg" id="uMsg" role="alert"></div>
    <div class="au-cat">Quem pode criar conta</div>
    <label class="au-check"><input type="checkbox" id="uOpen" ${cfg.cadastroAberto ? 'checked' : ''}> Permitir que <b>qualquer pessoa</b> crie conta (desmarcado = só e-mails autorizados abaixo)</label>
    <div class="au-tags" style="margin:10px 0">${aut.map(e => `<span>${esc(e)} <button type="button" data-aut-del="${esc(e)}" title="Remover" aria-label="Remover ${esc(e)}">×</button></span>`).join('') || '<em>Nenhum e-mail autorizado ainda.</em>'}</div>
    <div style="display:flex;gap:8px;margin-bottom:18px"><input class="au-plain" id="uNew" type="email" placeholder="email@exemplo.com" style="flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:12px"><button class="btn" id="uAdd" type="button">＋ Autorizar</button></div>
    <div class="au-cat">Usuários (${us.length})</div>
    ${us.map(u => {
      const eu = u.uid === user.id, criador = u.uid === cfg.criadorUid, trava = eu || criador;
      const podeEditar = !trava && (isAdmin() || u.papel !== 'admin');
      return `<div class="au-item"><div class="au-main"><b>${esc(u.email)}${eu ? ' (você)' : ''}${criador ? ' · criador' : ''}</b><small>${esc(u.nome || 'sem nome')}</small></div>
      <div class="au-acts"><select class="select" data-papel="${esc(u.uid)}" ${podeEditar ? '' : 'disabled'}>${opt('operador', u.papel)}${opt('gestor', u.papel)}${isAdmin() ? opt('admin', u.papel) : ''}</select>
      <label class="au-check"><input type="checkbox" data-ativo="${esc(u.uid)}" ${u.ativo ? 'checked' : ''} ${podeEditar ? '' : 'disabled'}> Ativo</label></div></div>`; }).join('')}`;
  const msg = q('#uMsg', box), ok = t => showMsg(msg, 'ok', t), err = e => showMsg(msg, 'err', erroMsg(e));
  q('#uOpen', box).onchange = async ev => { try { await B.setConfig({ cadastroAberto: ev.target.checked }); ok(ev.target.checked ? 'Cadastro aberto a qualquer pessoa.' : 'Cadastro restrito aos e-mails autorizados.'); } catch (e) { ev.target.checked = !ev.target.checked; err(e); } };
  q('#uAdd', box).onclick = async () => {
    const e = q('#uNew', box).value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)) return showMsg(msg, 'err', 'Digite um e-mail válido.');
    try { await B.addAutorizado(e); tabUsuarios(box); } catch (x) { err(x); }
  };
  qa('[data-aut-del]', box).forEach(b => b.onclick = async () => { try { await B.delAutorizado(b.dataset.autDel); tabUsuarios(box); } catch (x) { err(x); } });
  qa('[data-papel]', box).forEach(sel => sel.onchange = async () => {
    const u = us.find(x => x.uid === sel.dataset.papel);
    if (sel.value === 'admin' && !isAdmin()){ sel.value = u.papel; return; }
    if (!confirm('Mudar o perfil de ' + u.email + ' para ' + PAPEL[sel.value] + '?')){ sel.value = u.papel; return; }
    try { await B.setUserAdmin(u.uid, { papel: sel.value }); u.papel = sel.value; ok('Perfil atualizado.'); } catch (x) { sel.value = u.papel; err(x); }
  });
  qa('[data-ativo]', box).forEach(c => c.onchange = async () => {
    const u = us.find(x => x.uid === c.dataset.ativo);
    try { await B.setUserAdmin(u.uid, { ativo: c.checked }); u.ativo = c.checked; ok(c.checked ? 'Usuário ativado.' : 'Usuário desativado.'); } catch (x) { c.checked = !c.checked; err(x); }
  });
}

/* =============== topo e barra de ferramentas =============== */
function atualizarUserBtn(){
  const b = q('#userBtn'); if (b) b.innerHTML = '👤 <span>' + esc(nomeUser()) + '</span>';
}
function montarUI(){
  desmontarUI();
  const b = document.createElement('button');
  b.id = 'userBtn'; b.className = 'user-btn'; b.type = 'button'; b.title = 'Painel de controle';
  b.onclick = () => openPanel('notas');
  q('.topbar').insertBefore(b, q('#menuBtn')); atualizarUserBtn();
  const tb = q('.toolbar');
  const add = document.createElement('button');
  add.className = 'btn nova-nota'; add.type = 'button'; add.textContent = '＋ Nova anotação'; add.onclick = () => openPanel('notas');
  const painel = document.createElement('button');
  painel.className = 'btn ghost painel-btn'; painel.type = 'button'; painel.textContent = '⚙️ Painel de controle'; painel.onclick = () => openPanel('notas');
  tb.appendChild(add); tb.appendChild(painel);
}
function desmontarUI(){ qa('#userBtn,.nova-nota,.painel-btn').forEach(x => x.remove()); }

/* =============== quando a pessoa entra / sai =============== */
async function onAuth(u){
  const seq = ++authSeq;
  if (!u){
    user = null; perfil = null; notes = []; shared = {}; pend = null;
    desmontarUI(); const old = q('#authGate'); if (old) old.remove();
    document.documentElement.classList.add('auth-lock');
    rebuild(); buildGate(); return;
  }
  try {
    let p = await B.getProfile(), novo = false;
    if (!p){ p = await B.createProfile(); novo = true; }
    if (seq !== authSeq) return;
    if (!p.ativo) throw { code: 'app/desativada' };
    user = u; perfil = Object.assign({ nome: '', tema: 'light', favoritos: [], usos: {}, ordem: [] }, p);
    /* a escolha feita neste aparelho vale; o perfil só define o tema em aparelho novo */
    let loc = null; try { loc = localStorage.getItem('an_tema'); } catch (x) {}
    if (loc && loc !== perfil.tema) salvarPerfil({ tema: loc }); else if (!loc) aplicarTema(perfil.tema);
    await Promise.all([loadShared(), loadNotes()]);
    if (seq !== authSeq) return;
    montarUI(); rebuild();
    const g = q('#authGate'); if (g) g.remove();
    document.documentElement.classList.remove('auth-lock');
    if (novo && B.mode === 'firebase' && !B.verified()) B.sendVerification().catch(() => {});
  } catch (e) {
    if (seq !== authSeq) return;
    console.error('Login/perfil:', e);
    if (e && e.code === 'app/nao-autorizado') await B.discardIfNew();
    gateMsg = erroMsg(e); await B.signOut();
  }
}

(async function start(){
  const ready = Object.values(FIREBASE_CONFIG).every(v => v);
  try { B = ready ? await backendFirebase() : backendLocal(); }
  catch (e) {
    /* com o banco configurado, nunca cai para o modo local: mostra o erro e mantém a página bloqueada */
    console.error(e);
    const g = document.createElement('div'); g.className = 'au-gate';
    g.innerHTML = '<div class="au-card"><h1>Sem conexão com o banco</h1><p class="au-msg err show">Não foi possível conectar ao banco de dados (Firebase). Verifique sua internet e recarregue a página.</p><button class="btn au-go" type="button" onclick="location.reload()">Recarregar</button></div>';
    document.getElementById('conteudo').insertAdjacentElement('beforebegin', g);
    return;
  }
  B.watch(onAuth);
})();
})();
