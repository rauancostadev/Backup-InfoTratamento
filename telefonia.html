<body data-page="telefonia">

<section class="hero">
  <div class="hero-inner">
    <div>
      <span class="eyebrow">☎️ Telefonia</span>
      <h1>Lista Telefônica</h1>
      <p>Contatos dos setores e unidades. Busque pelo nome do setor ou pelo número, e clique no número para copiá-lo.</p>
    </div>
  </div>
</section>

<main class="wrap" id="conteudo">

  <div class="kpis">
    <div class="kpi"><div class="kpi-ico">📇</div><div><b id="kTotal">0</b><span>Contatos</span></div></div>
    <div class="kpi"><div class="kpi-ico">🏥</div><div><b id="kUnits">0</b><span>Unidades</span></div></div>
    <div class="kpi"><div class="kpi-ico">🗂️</div><div><b id="kGroups">0</b><span>Áreas</span></div></div>
    <div class="kpi"><div class="kpi-ico">💬</div><div><b id="kWa">0</b><span>Via WhatsApp</span></div></div>
  </div>

  <div class="toolbar">
    <div class="search"><input type="search" id="busca" placeholder="Pesquisar setor ou telefone..." autocomplete="off" aria-label="Pesquisar setor ou telefone"></div>
    <select class="select" id="grpSel" aria-label="Filtrar por área"></select>
    <div class="spacer"></div>
    <div class="seg" id="seg">
      <button class="active" data-v="cards">Cartões</button>
      <button data-v="list">Lista</button>
    </div>
    <button class="btn ghost" onclick="window.print()">🖨 Imprimir</button>

  <div class="subbar">

  <div id="viewCards"></div>

  <div class="page-end"></div>

const GROUPS = [
  { k:'Urgência',                  ico:'🚑' },
  { k:'Internação e Cirurgia',     ico:'🛏️' },
  { k:'Exames e Imagem',           ico:'📋' },
  { k:'Atendimento',               ico:'💬' },
  { k:'Secretarias',               ico:'👩‍💼' },  
  { k:'Apoio Multiprofissional',   ico:'🩺' },
  { k:'Administrativo',            ico:'🏢' }
];
const UNITS = ['LIGA','HLA','POL','CECAN','HOS'];

const $ = id => document.getElementById(id);
const plural = (n,s,p) => n + ' ' + (n===1 ? s : p);
const state = { q:'', unit:'all', grp:'all', view:'cards' };

DATA.forEach(d => {
  d.nq = UI.norm([d.n, d.o, d.u, d.g].join(' '));
  d.digits = d.nums.map(n => n.replace(/\D/g,'')).join(' ');
});

function matches(d){
  const q = UI.norm(state.q.trim());
  const qd = state.q.replace(/\D/g,'');
  return (state.unit==='all' || d.u===state.unit) &&
         (state.grp==='all'  || d.g===state.grp) &&
         (!q || d.nq.includes(q) || (qd.length >= 3 && d.digits.includes(qd)));
}

function numBtns(d, small){
  return d.nums.map(n => `<button class="numbtn ${small?'sm':''}" data-copy="${UI.esc(n)}" type="button" title="Copiar ${UI.esc(n)}">${UI.esc(n)}</button>`).join('');
}
function waBtn(d){
  return d.wa ? `<a class="btn wa-btn" href="https://wa.me/${d.wa}" target="_blank" rel="noopener noreferrer">💬 WhatsApp</a>` : '';
}

function card(d){
  return `<article class="phone u-${d.u}">
    <h3>${UI.esc(d.n)}</h3><span class="unit">${d.u}</span>
    <div class="nums-row">${numBtns(d)}</div>
    ${d.o ? `<div class="obs">${UI.esc(d.o)}</div>` : ''}
    ${d.wa ? `<div class="acts">${waBtn(d)}</div>` : ''}
  </article>`;
}

function renderChips(){
  $('chips').innerHTML =
    `<button class="chip ${state.unit==='all'?'active':''}" data-u="all">Todas <em>${DATA.length}</em></button>` +
    UNITS.map(u => `<button class="chip u-${u} ${state.unit===u?'active':''}" data-u="${u}"><i></i>${u} <em>${DATA.filter(d=>d.u===u).length}</em></button>`).join('');
}

function render(){
  const list = DATA.filter(matches);
  $('kTotal').textContent = list.length;
  $('kUnits').textContent = new Set(list.map(d => d.u)).size;
  $('kGroups').textContent = new Set(list.map(d => d.g)).size;
  $('kWa').textContent = list.filter(d => d.wa).length;
  $('count').textContent = plural(list.length,'contato exibido','contatos exibidos');

  const sorted = list.slice().sort((a,b) => a.n.localeCompare(b.n,'pt-BR') || a.u.localeCompare(b.u));

  /* cartões agrupados por área */
  $('viewCards').innerHTML = GROUPS.map(g => {
    const items = sorted.filter(d => d.g===g.k);
    if(!items.length) return '';
    return `<section class="section">
      <div class="sec-head"><h2>${g.ico} ${g.k}</h2><span class="count-pill">${items.length}</span></div>
      <div class="phone-grid" style="margin-bottom:0">${items.map(card).join('')}</div>
    </section>`;
  }).join('') || '<div class="nothing"><big>🔎</big>Nenhum contato encontrado</div>';

  /* lista (tabela) */
  $('viewList').innerHTML = sorted.length ? `<table class="list">
    <thead><tr><th>Setor</th><th>Telefone</th><th>Unidade</th><th>Observação</th></tr></thead>
    <tbody>${sorted.map(d => `<tr>
      <td class="nm">${UI.esc(d.n)}</td>
      <td>${numBtns(d,true)}</td>
      <td><span class="unit u-${d.u}" style="position:static;display:inline-block">${d.u}</span></td>
      <td>${d.o ? UI.esc(d.o) : ''} ${waBtn(d)}</td></tr>`).join('')}</tbody></table>`
    : '<div class="nothing" style="margin:20px"><big>🔎</big>Nenhum contato encontrado</div>';

  $('viewCards').style.display = state.view==='cards' ? '' : 'none';
  $('viewList').style.display  = state.view==='list'  ? '' : 'none';
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('active', b.dataset.v===state.view));
  renderChips();
}

/* ---------- eventos ---------- */
$('grpSel').innerHTML = '<option value="all">Todas as áreas</option>' + GROUPS.map(g => `<option value="${g.k}">${g.ico} ${g.k}</option>`).join('');
$('busca').addEventListener('input', UI.debounce(e => { state.q = e.target.value; render(); }, 100));
$('grpSel').addEventListener('change', e => { state.grp = e.target.value; render(); });
$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if(!b) return; state.unit = b.dataset.u; render(); });
$('seg').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; state.view = b.dataset.v; render(); });
document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if(b) UI.copy(b.dataset.copy, 'Número copiado: ' + b.dataset.copy);
});

render();
</script>
</body>
</html>
